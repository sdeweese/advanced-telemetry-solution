telemetry
  destination-group 100
    ip address 172.0.0.50 port 57000 protocol gRPC encoding GPB
    use-vrf management
    use-chunking size 4096
  sensor-group chassis
    path sys/ch query-condition query-target=subtree&target-subtree-class=eqptBSlot,eqptBoard,eqptCPU,eqptFan,eqptFC,eqptFCSlot,eqptFt,eqptFtSlot,eqptLC,eqptLCSlot,eqptPsu,eqptPsuSlot,eqptSensor,eqptSupC,eqptSupCSlot
  sensor-group interfaces
    path sys/intf query-condition query-target=subtree&target-subtree-class=l1PhysIf,ethpmPhysIf,pcAggrIf,ethpmAggrIf,rmonIfIn,rmonIfOut,ethpmFcot,eqptFcotSensor,rmonEtherStats,rmonDot3Stats
  sensor-group bgp
    data-source NX-API
    path "show bgp all summary" depth unbounded
  sensor-group procsys
    path sys/procsys/syscpusummary depth 3
    path sys/procsys/sysmem depth 3
  sensor-group system_info
    path sys
    path sys/showversion
  sensor-group alarms
    path sys/alarms depth unbounded
  subscription 200
    dst-grp 100
    snsr-grp procsys sample-interval 300000
    snsr-grp system_info sample-interval 300000
    snsr-grp alarms sample-interval 0
    snsr-grp bgp sample-interval 30000
    snsr-grp chassis sample-interval 30000
    snsr-grp interfaces sample-interval 30000
