[[processors.template]]
  order = 1
  namepass = ["show bgp all summary"]
  tag = "af_path"
  template = 'vrf={{ .Tag "TABLE_vrf" }}/af={{ .Tag "TABLE_af" }}/saf={{ .Tag "TABLE_saf" }}'
  [processors.template.tagdrop] 
    run_time = ["after_merge"]

[[processors.template]]
  order = 2
  namepass = ["show bgp all summary"]
  tag = "neighbor_path"
  template = '{{ .Tag "af_path" }}/neighbor={{ .Tag "TABLE_neighbor" }}'
  [processors.template.tagdrop] 
    run_time = ["after_merge"]

[[processors.converter]]
  order = 3
  namepass = ["show bgp all summary"]
  [processors.converter.tags]
    string = ["row_number", "TABLE_neighbor", "neighbor_path"]
  [processors.converter.tagdrop] 
    run_time = ["after_merge"]

[[processors.execd]]
  alias = "field_prefix"
  order = 4
  namepass = ["show bgp all summary"]
  command = ["/usr/bin/field_prefix", "neighbor_path"]
  [processors.execd.tagdrop] 
    run_time = ["after_merge"]

[[aggregators.merge]]
  namepass = ["show bgp all summary"]
  round_timestamp_to = "1ms"
  grace = "1s"
  period = "60s"
  drop_original = true
  [aggregators.merge.tags] 
    run_time = "after_merge"

[[processors.converter]]
  order = 5
  namepass = ["show bgp all summary"]
  [processors.converter.fields]
    tag = ["*|af_name"]
  [processors.converter.tagpass] 
    run_time = ["after_merge"]

[[processors.regex]]
  order = 6
  namepass = ["show bgp all summary"]
  [[processors.regex.tag_rename]]
    pattern = '.*\|af_name'
    replacement = "af_name"

[[processors.execd]]
  alias = "split_metrics"
  order = 7
  namepass = ["show bgp all summary"]
  command = ["/usr/bin/split_metrics", "neighbor_path"]
  [processors.execd.tagpass] 
    run_time = ["after_merge"]

[[processors.converter]]
  order = 8
  namepass = ["show bgp all summary"]
  [processors.converter.fields]
    tag = ["TABLE_neighbor", "neighboras"]
  [processors.converter.tagpass] 
    run_time = ["after_merge"]

[[processors.rename]]
  order = 9
  namepass = ["show bgp all summary"]
  [[processors.rename.replace]]
    field = "time"
    dest = "uptime"
  [processors.rename.tagpass] 
    run_time = ["after_merge"]


