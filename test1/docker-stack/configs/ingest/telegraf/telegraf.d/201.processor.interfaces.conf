# telegraf runs inputs -> processors -> aggregators -> processors (optional) -> outputs
# to control the order of execution, use the order field in the configuration and the run_time tag

[[processors.regex]]
  order = 1
  namepass = ["sys/intf"]

  [[processors.regex.tags]]
    ## Regular expression to match on a tag name
    key = "dn"
    ## example dn: "sys/intf/phys-[eth1/42]"
    pattern = '^sys\/intf\/(phys|aggr)-\[(.*)\].*$'
    ## Replacement expression defining the name of the new tag
    replacement = "${2}"
    ## example result_key: "eth1/42"
    result_key = "interface"

  [processors.regex.tagdrop] 
    run_time = ["after_merge"]

[[processors.converter]]
  order = 2
  namepass = ["sys/intf"]
  [processors.converter.tags]
    string = ["dn"]
  [processors.converter.tagdrop] 
    run_time = ["after_merge"]

[[processors.execd]]
  alias = "field_prefix"
  order = 3
  namepass = ["sys/intf"]
  command = ["/usr/bin/field_prefix", "dn"]
  [processors.execd.tagdrop] 
    run_time = ["after_merge"]

# Merge metrics into multifield metrics by series key
[[aggregators.merge]]
  namepass = ["sys/intf"]
  log_level = "debug"
  ## Precision to round the metric timestamp to
  ## This is useful for cases where metrics to merge arrive within a small
  ## interval and thus vary in timestamp. The timestamp of the resulting metric
  ## is also rounded.
  round_timestamp_to = "1ms"
  grace = "1s"
  period = "60s"
  drop_original = true
  [aggregators.merge.tags] 
    run_time = "after_merge"

[[processors.converter]]
  order = 5
  namepass = ["sys/intf"]
  [processors.converter.fields]
    tag = [
    "sys/intf/phys-*|descr",
    "sys/intf/aggr-*|descr",
    "sys/intf/phys-*/phys|adminSt",
    "sys/intf/aggr-*/aggrif|adminSt",
    ]

  [processors.converter.tagpass] 
    run_time = ["after_merge"]

[[processors.regex]]
  order = 6
  namepass = ["sys/intf"]
  [[processors.regex.tag_rename]]
    pattern = '^sys\/intf\/(phys|aggr)-\[.*\]\|descr$'
    replacement = "descr"
  [[processors.regex.tag_rename]]
    pattern = '^sys\/intf\/(phys|aggr)-\[.*\]\/(phys|aggrif)\|adminSt$'
    replacement = "adminSt"
  [processors.regex.tagpass] 
    run_time = ["after_merge"]

[[processors.execd]]
  alias = "split_metrics"
  order = 7
  namepass = ["sys/intf"]
  command = ["/usr/bin/split_metrics", "dn"]
  [processors.execd.tagpass] 
    run_time = ["after_merge"]

[[processors.strings]]
  order = 8
  namepass = ["sys/intf"]
  # Convert a tag value to lowercase
  [[processors.strings.lowercase]]
    tag = "descr"
  ## Trim leading and trailing whitespace using the default cutset
  [[processors.strings.trim]]
    tag = "descr"
  [processors.strings.tagpass] 
    run_time = ["after_merge"]

## will add customer, asn and category tags
[[processors.lookup]]
  ## List of files containing the lookup-table
  namepass = ["sys/intf"]
  order = 9
  files = ["/etc/telegraf/telegraf.d/references/customer.json"]
  key = '{{.Tag "descr"}}'
  [processors.lookup.tagpass] 
    run_time = ["after_merge"]

[[processors.regex]]
  order = 10
  namepass = ["sys/intf"]

  [[processors.regex.tags]]
    ## Regular expression to match on a tag name
    key = "dn"
    ## example dn: "sys/intf/phys-[eth1/42]"
    pattern = '^sys\/intf\/(phys|aggr)-\[.*\].*$'
    ## Replacement expression defining the name of the new tag
    replacement = "${1}"
    ## example result_key: "eth1/42"
    result_key = "type"

  [[processors.regex.tags]]
    ## Regular expression to match on a tag name
    key = "dn"
    ## example dn: "sys/intf/phys-[eth1/42]"
    pattern = '^sys\/intf\/(phys|aggr)-\[.*\]\/dbgIf(In|Out)$'
    ## Replacement expression defining the name of the new tag
    replacement = "${2}"
    ## example result_key: "eth1/42"
    result_key = "direction"

  [processors.regex.tagpass] 
    run_time = ["after_merge"]

[[processors.converter]]
  order = 11
  namepass = ["sys/intf"]
  [processors.converter.fields]
    tag = ["unit"]
    string = ["siList"]

  [processors.converter.tagpass] 
    run_time = ["after_merge"]
    dn = ["sys/intf/phys-*/phys/fcot/lane-*-sensor-*", "sys/intf/phys-*/phys/fcotdd/lane-*-sensor-*"]
