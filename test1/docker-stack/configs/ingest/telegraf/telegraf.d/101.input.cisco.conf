[[inputs.cisco_telemetry_mdt]]
 ## Telemetry transport can be "tcp" or "grpc".  TLS is only supported when
 ## using the grpc transport.
 transport = "grpc"
 ## Address and port to host telemetry listener
 service_address = ":57000"
 namepass = ["sys/procsys/syscpusummary", "sys/procsys/sysmem", "sys", "sys/showversion", "sys/alarms", "show bgp all summary", "vxlan*", "sys/intf", "sys/ch"]
## Define (for certain nested telemetry measurements with embedded tags) which fields are tags
#  embedded_tags = [
# 	"interface:sys/intf/children/pcAggrIf/attributes/id",
# 	"interface:sys/intf/children/l1PhysIf/attributes/id",
# ]
 [inputs.cisco_telemetry_mdt.tags]
  bucket_tag = "cisco_mdt"

[[processors.rename]]
  [[processors.rename.replace]]
    tag = "source"
    dest = "switch"
  [[processors.rename.replace]]
    tag = "node_id_str"
    dest = "switch"
