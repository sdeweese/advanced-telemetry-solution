# Processor Plugins
[[processors.converter]]
  namepass = ["sys/ch/"]
  [processors.converter.fields]
    string = ["ver"]
    integer = ["speed", "cap"]

[[processors.converter]]
  namepass = ["sys/ch"]
  [processors.converter.fields]
    string = ["rev"]
    tag = ["model"]

[[processors.converter]]
  namepass = ["sys/procsys/sysmem"]
  [processors.converter.fields]
    integer = ["avg", "curr", "max", "min"]

[[processors.converter]]
  namepass = ["sys/procsys"]
  [processors.converter.fields]
    integer = ["avg", "curr", "max", "min"]
