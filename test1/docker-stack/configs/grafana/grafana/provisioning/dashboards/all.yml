apiVersion: 1

providers:
- name: 'telemetry'
  orgId: 1
  folder: 'Telemetry'
  type: file
  disableDeletion: false
  updateIntervalSeconds: 3 #how often Grafana will scan for changed dashboards
  options:
    path: /var/lib/grafana/dashboards/telemetry

- name: 'selfmonitoring'
  orgId: 1
  folder: 'Self Monitoring'
  type: file
  disableDeletion: false
  updateIntervalSeconds: 3 #how often Grafana will scan for changed dashboards
  options:
    path: /var/lib/grafana/dashboards/selfmonitoring
