[server]
http_addr =
http_port = 443
domain = torix.ca
root_url = https://tats.torix.ca:443
cert_key = /etc/grafana/grafana.key
cert_file = /etc/grafana/grafana.crt
enforce_domain = False
protocol = https

[feature_toggles]
# there are currently two ways to enable feature toggles in the `grafana.ini`.
# you can either pass an array of feature you want to enable to the `enable` field or
# configure each toggle by setting the name of the toggle to true/false. Toggles set to true/false
# will take precedence over toggles in the `enable` list.

# enable = feature1,feature2
# enabling transformationsVariableSupport should allow you to use variables in transformations
enable = transformationsVariableSupport
