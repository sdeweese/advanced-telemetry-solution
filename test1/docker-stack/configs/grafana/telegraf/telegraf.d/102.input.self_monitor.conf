[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_names = []
  timeout = "5s"
  perdevice = true
  total = false
  storage_objects = ["container", "image", "volume"]
  docker_label_include = ["com.docker.compose.service"]
  [inputs.docker.tags]
    bucket_tag = "docker_metrics"

[[inputs.internal]]
  [inputs.internal.tags]
    bucket_tag = "telegraf_metrics"

