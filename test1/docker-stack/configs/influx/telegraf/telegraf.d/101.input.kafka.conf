# Kafka is running in two single node clusters
# which is why we have two kafka_consumer inputs rather than putting
# both brokers in the same brokers list.

[[inputs.kafka_consumer]]
  brokers = ["$KAFKA_BROKER_PRIMARY"]
  topics = ["telegraf"]
  data_format = "influx"

[[inputs.kafka_consumer]]
  brokers = ["$KAFKA_BROKER_SECONDARY"]
  topics = ["telegraf"]
  data_format = "influx"
